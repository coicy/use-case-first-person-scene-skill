name: Tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[ui]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          ucscene validate examples/warehouse-scan.json
          ucscene plan examples/warehouse-scan.json --out /tmp/scene-plan.json
          ucscene review /tmp/scene-plan.json
          ucscene benchmark benchmarks/famous-projects/suite.json --lock benchmarks/famous-projects/prompt-lock.json --out /tmp/official-benchmark.json
          ucscene benchmark-export benchmarks/famous-projects/suite.json --out-dir /tmp/benchmark-plans
          ucscene benchmark-rating-template benchmarks/famous-projects/suite.json --out /tmp/human-rating-template.json
          ucscene review /tmp/benchmark-plans/BENCH-OPENTTD-RAIL.json
          ucscene review /tmp/benchmark-plans/BENCH-LUANTI-MINE.json
          ucscene extract examples/warehouse-scan.md --out /tmp/extracted.json
          ucscene validate /tmp/extracted.json
          ucscene plan /tmp/extracted.json --out /tmp/extracted-plan.json
          ucscene review /tmp/extracted-plan.json
          python examples/make_demo_assets.py
          ucscene anchor-create /tmp/scene-plan.json --image out/demo/scene.png --out /tmp/demo-anchor.json
          ucscene anchor-verify /tmp/demo-anchor.json --plan /tmp/scene-plan.json
          ucscene compose-ui --scene out/demo/scene.png --ui out/demo/ui.png --quad examples/screen-quad.demo.json --out /tmp/composited.png --report /tmp/composited-report.json
          # Actual acceptance gallery paths, input integrity and HTML review are exercised in tests/test_acceptance.py.
